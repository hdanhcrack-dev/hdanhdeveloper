<!DOCTYPE html>
<html>
<head>
    <title>Discord Token Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: white;
        }
        .container {
            background: #16213e;
            padding: 40px;
            border-radius: 15px;
            width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #7289da;
        }
        .input-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            color: #b9bbbe;
        }
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #2f3136;
            border-radius: 8px;
            background: #1e1f22;
            color: white;
            font-size: 14px;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #7289da;
        }
        button {
            width: 100%;
            padding: 14px;
            background: #7289da;
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background: #5b6eae;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .info {
            margin-top: 20px;
            padding: 15px;
            background: #1e1f22;
            border-radius: 8px;
            display: none;
        }
        .info.show {
            display: block;
        }
        .info-item {
            padding: 8px 0;
            border-bottom: 1px solid #2f3136;
        }
        .info-item:last-child {
            border-bottom: none;
        }
        .error {
            color: #ed4245;
            margin-top: 10px;
            display: none;
        }
        .success {
            color: #3ba55c;
            margin-top: 10px;
            display: none;
        }
        .warning {
            background: #faa81a;
            color: #1a1a2e;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎮 Discord Login</h1>
        <div class="warning">
            ⚠️ Sử dụng token cá nhân vi phạm ToS và có thể bị khóa tài khoản!
        </div>
        
        <div class="input-group">
            <label>🔑 Discord Token</label>
            <input type="password" id="token" placeholder="Nhập token của bạn...">
        </div>
        
        <button id="loginBtn" onclick="login()">Đăng Nhập</button>
        
        <div id="error" class="error"></div>
        <div id="success" class="success"></div>
        
        <div id="userInfo" class="info">
            <div class="info-item">👤 <span id="username">Loading...</span></div>
            <div class="info-item">🆔 <span id="userId">Loading...</span></div>
            <div class="info-item">📧 <span id="email">Loading...</span></div>
            <div class="info-item">✅ <span id="verified">Loading...</span></div>
            <div class="info-item">📅 <span id="created">Loading...</span></div>
            <div class="info-item">📊 <span id="guilds">Loading...</span></div>
        </div>
    </div>

    <script>
        async function login() {
            const token = document.getElementById('token').value.trim();
            const btn = document.getElementById('loginBtn');
            const error = document.getElementById('error');
            const success = document.getElementById('success');
            const info = document.getElementById('userInfo');
            
            if (!token) {
                error.textContent = '❌ Vui lòng nhập token!';
                error.style.display = 'block';
                return;
            }
            
            btn.disabled = true;
            btn.textContent = '⏳ Đang đăng nhập...';
            error.style.display = 'none';
            success.style.display = 'none';
            info.classList.remove('show');
            
            try {
                // Lấy thông tin user
                const userResp = await fetch('https://discord.com/api/v9/users/@me', {
                    headers: { 'Authorization': token }
                });
                
                if (!userResp.ok) {
                    throw new Error(`Token không hợp lệ! (${userResp.status})`);
                }
                
                const userData = await userResp.json();
                
                // Lấy danh sách server
                const guildsResp = await fetch('https://discord.com/api/v9/users/@me/guilds', {
                    headers: { 'Authorization': token }
                });
                const guildsData = await guildsResp.json();
                
                // Hiển thị thông tin
                document.getElementById('username').textContent = 
                    `${userData.username}#${userData.discriminator || '0'}`;
                document.getElementById('userId').textContent = userData.id;
                document.getElementById('email').textContent = userData.email || 'Không có';
                document.getElementById('verified').textContent = userData.verified ? '✅ Đã xác thực' : '❌ Chưa xác thực';
                document.getElementById('guilds').textContent = `${guildsData.length} server`;
                
                // Tính tuổi tài khoản
                const timestamp = (BigInt(userData.id) >> 22n) + 1420070400000n;
                const createdDate = new Date(Number(timestamp));
                const days = Math.floor((Date.now() - createdDate.getTime()) / (1000 * 60 * 60 * 24));
                document.getElementById('created').textContent = 
                    `${createdDate.toLocaleDateString('vi-VN')} (${days} ngày)`;
                
                info.classList.add('show');
                success.textContent = '✅ Đăng nhập thành công!';
                success.style.display = 'block';
                
                // Lưu token vào localStorage (không khuyến khích)
                // localStorage.setItem('discord_token', token);
                
            } catch (err) {
                error.textContent = `❌ ${err.message}`;
                error.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Đăng Nhập';
            }
        }
        
        // Auto login if token in localStorage
        // const savedToken = localStorage.getItem('discord_token');
        // if (savedToken) {
        //     document.getElementById('token').value = savedToken;
        //     login();
        // }
    </script>
</body>
</html>
